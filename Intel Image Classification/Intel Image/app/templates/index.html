<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intel Image Classification App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9f9f9;
    }
    .navbar-custom {
      background-color: #ff6600;
    }
    .form-card {
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .upload-btn {
      background-color: #ff6600;
      border: none;
    }
    .upload-btn:hover {
      background-color: #e55d00;
    }
    .result-img {
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-custom navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand text-white fw-bold mx-auto" href="#">Intel Image Classification App</a>
      <span class="text-white ms-auto">Made by <strong>Jay</strong></span>
    </div>
  </nav>

  <!-- Main Section -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="form-card">
          <form action="/" method="post" enctype="multipart/form-data">
            <div class="row">
              <!-- Upload Section -->
              <div class="col-md-6">
                <h5 class="mb-4">Upload Image</h5>
                <div class="mb-3">
                  <input class="form-control" type="file" id="image_upload" name="image_upload" required>
                </div>
                <div class="mb-4">
                  <input class="form-control" type="text" id="image_name" name="image_name" placeholder="Image file name" readonly>
                </div>
                <button type="submit" class="btn btn-lg text-white upload-btn w-100">Predict</button>
              </div>

              <!-- Output Section -->
              <div class="col-md-6 text-center">
                {% if full_filename %}
                  <img src="{{ url_for('static', filename=full_filename) }}" class="img-fluid result-img mb-3" width="500" height="300">
                  <h5 class="text-primary mt-3">{{ pred }}</h5>
                {% else %}
                  <p class="text-muted mt-5">Prediction result will appear here.</p>
                {% endif %}
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('image_upload').onchange = function () {
      const pathParts = this.value.split("\\");
      document.getElementById('image_name').value = pathParts[pathParts.length - 1];
    };
  </script>
</body>
</html>
